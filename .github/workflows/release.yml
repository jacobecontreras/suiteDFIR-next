# Release builds (ROADMAP F1, DEVELOPMENT.md §2 and §6).
#
# - workflow_dispatch: a build-only dry run. The `os` input picks the build legs (default: linux):
#   linux = Linux x64 and arm64, macos = macOS arm64 and x64, windows = Windows x64 and arm64.
#   Everything up to the release notes and SHA256SUMS is produced and uploaded to the run
#   (retention-days: 1); no release is created.
# - A pushed tag v<version>: every leg builds, then a DRAFT GitHub release is created with the
#   bundles, SHA256SUMS and the source-obligation files. Automation never publishes it (H3). The
#   macOS and Windows legs run only while the repository is public; otherwise the macOS and
#   Windows x64 bundles are built locally (DEVELOPMENT.md §2), and the Windows arm64 installer,
#   which has no local recipe, by a dispatch of this workflow with os=windows, and they are added
#   to the draft by hand.
# - Legs (S3 added the arm64 ones): Linux x64 and arm64 (AppImage, deb) in the ubuntu:22.04
#   container; macOS arm64 and x64 (dmg); Windows x64 (NSIS online and offline, iOS tools bundled);
#   Windows arm64 (NSIS online only, no iOS tools: there is no pinned libimobiledevice build for
#   it, so the app reports acquisition as unsupported there).
# - Signing (H1): the macOS legs sign only when APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY and
#   APPLE_TEAM_ID exist, and notarize only when APPLE_ID and APPLE_PASSWORD exist as well; Windows
#   signing is not set up yet. The release notes say which builds are unsigned or not notarized.
#
# Release builds use no build cache and run `cargo tauri build --runner scripts/cargo-auditable`,
# so every binary carries its dependency list (cargo-auditable).
name: release

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Which build legs to run (a dry run: no release is created)"
        type: choice
        options: [linux, macos, windows, all]
        default: linux
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The exact Tauri CLI (DEVELOPMENT.md §1). Release builds are the only place CI installs it.
  TAURI_CLI_VERSION: "2.11.5"
  CARGO_AUDITABLE_VERSION: "0.7.6"

defaults:
  run:
    shell: bash

jobs:
  # The pinned libimobiledevice sources, the build script and source patches that built the pinned
  # tool bundles, and each bundle's BUILDINFO.json: the exact files on the idevice-tools-<release>
  # prerelease, checked against idevice-tools.json (and the script and patches against the hashes
  # every BUILDINFO.json records).
  sources:
    name: Source obligations (libimobiledevice stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag must name the app version
        if: github.event_name == 'push'
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version (tauri.conf.json)"
            exit 1
          fi

      - name: Fetch and check the source tarballs, build script, patches and BUILDINFO files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=idevice-tools.json
          tag="idevice-tools-$(jq -er .release "$manifest")"
          mkdir -p "$RUNNER_TEMP/dl" dist
          fetch() {
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$1" --dir "$RUNNER_TEMP/dl"
            echo "$2  $RUNNER_TEMP/dl/$1" | sha256sum -c -
          }
          # The exact source tarballs.
          jq -r '.sources[] | [(.url | split("/") | last), .sha256] | @tsv' "$manifest" |
            while IFS=$'\t' read -r name sha; do
              fetch "$name" "$sha"
              mv "$RUNNER_TEMP/dl/$name" dist/
            done
          # Each tool bundle's BUILDINFO.json (the bundle is checked against bundle_sha256).
          jq -r '.platforms | to_entries[] | [.key, .value.bundle, .value.bundle_sha256] | @tsv' "$manifest" |
            while IFS=$'\t' read -r platform bundle sha; do
              fetch "$bundle" "$sha"
              unzip -p "$RUNNER_TEMP/dl/$bundle" BUILDINFO.json > "dist/BUILDINFO-$platform.json"
              jq -r .build_script_sha256 "dist/BUILDINFO-$platform.json" >> "$RUNNER_TEMP/script-sha256"
              jq -c '[(.patches // [])[] | [.file, .sha256]] | sort' "dist/BUILDINFO-$platform.json" >> "$RUNNER_TEMP/patches"
            done
          # The build script that built them: every BUILDINFO.json must name the same one.
          script_sha="$(sort -u "$RUNNER_TEMP/script-sha256")"
          if [ "$(printf '%s\n' "$script_sha" | wc -l)" -ne 1 ]; then
            echo "::error::the tool bundles were built by different scripts: $script_sha"
            exit 1
          fi
          fetch build-idevice-tools.sh "$script_sha"
          mv "$RUNNER_TEMP/dl/build-idevice-tools.sh" dist/
          # The source patches it applied: every BUILDINFO.json must list the same ones.
          patches="$(sort -u "$RUNNER_TEMP/patches")"
          if [ "$(printf '%s\n' "$patches" | wc -l)" -ne 1 ]; then
            echo "::error::the tool bundles were built with different patches: $patches"
            exit 1
          fi
          printf '%s\n' "$patches" | jq -r '.[] | @tsv' |
            while IFS=$'\t' read -r name sha; do
              if ! printf '%s\n' "$name" | grep -Eqx '[A-Za-z0-9._-]+\.patch'; then
                echo "::error::unexpected patch name $name"
                exit 1
              fi
              fetch "$name" "$sha"
              mv "$RUNNER_TEMP/dl/$name" dist/
            done
          ls -l dist
          (cd dist && sha256sum -- *)

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sources
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (AppImage, deb)
    if: github.event_name == 'push' || inputs.os == 'linux' || inputs.os == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rustup_target: x86_64-unknown-linux-gnu
            # https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
            # (the same pin as ci-rust.yml).
            rustup_sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          - arch: arm64
            runner: ubuntu-24.04-arm
            rustup_target: aarch64-unknown-linux-gnu
            # https://static.rust-lang.org/rustup/archive/1.29.1/aarch64-unknown-linux-gnu/rustup-init
            # (the same pin as leapp-smoke.yml).
            rustup_sha256: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
    runs-on: ${{ matrix.runner }}
    # glibc baseline for Linux builds (ARCHITECTURE.md §10), on both architectures. The Linux
    # packages bundle no iOS tools (the distribution's are used) and declare no dependency on them.
    container: ubuntu:22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # git must exist before checkout, otherwise actions/checkout falls back to a REST download.
      # The AppImage bundler copies /usr/bin/xdg-open into the AppImage (xdg-utils).
      - name: Install system packages (DEVELOPMENT.md §1, plus git, CA certificates, jq, xdg-utils)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git jq xdg-utils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential libssl-dev pkg-config curl wget file

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (pinned rustup-init; toolchain from rust-toolchain.toml)
        env:
          RUSTUP_INIT_VERSION: "1.29.1"
          RUSTUP_INIT_TARGET: ${{ matrix.rustup_target }}
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_sha256 }}
        run: |
          dl="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dl/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/${RUSTUP_INIT_TARGET}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  $dl/rustup-init" | sha256sum -c -
          chmod +x "$dl/rustup-init"
          "$dl/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustc --version

      - name: Install the Tauri CLI and cargo-auditable (exact versions)
        run: |
          cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked
          cargo install cargo-auditable --version "=${CARGO_AUDITABLE_VERSION}" --locked
          cargo install --list | grep -E '^(tauri-cli|cargo-auditable) '

      - name: Build (unsigned)
        env:
          # linuxdeploy (AppImage) is itself an AppImage, and containers have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --ci --runner "$GITHUB_WORKSPACE/scripts/cargo-auditable"

      - name: Collect and describe the bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          [ "$(ls dist | wc -l)" -eq 2 ] || { ls -l dist; echo "::error::expected one deb and one AppImage"; exit 1; }
          ls -l dist
          (cd dist && sha256sum -- *)
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (dmg)
    # Dispatch with os = macos or all; tag pushes only while the repository is public.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'macos' || inputs.os == 'all')) ||
      (github.event_name == 'push' && !github.event.repository.private)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, arch: arm64, platform: macos-aarch64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, arch: x64, platform: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version

      - name: Install the Tauri CLI and cargo-auditable (exact versions)
        run: |
          cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked
          cargo install cargo-auditable --version "=${CARGO_AUDITABLE_VERSION}" --locked
          cargo install --list | grep -E '^(tauri-cli|cargo-auditable) '

      - name: Fetch the pinned iOS tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask fetch-idevice-tools --target "${{ matrix.target }}"

      - name: Build (signed and notarized only when the H1 secrets exist)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            # Signing changes the bundled tools' bytes; the app then checks them against this team's
            # Developer ID signature instead of the pinned hashes.
            export SUITEDFIR_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            sign=""
            echo "signed=yes" >> "$GITHUB_ENV"
            # The bundler notarizes when APPLE_ID and APPLE_PASSWORD are set (even if empty), so
            # without both secrets the app is signed but not notarized. The assemble job's release
            # notes follow the same rule.
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
              unset APPLE_ID APPLE_PASSWORD
            fi
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            sign="--no-sign"
            echo "signed=no" >> "$GITHUB_ENV"
          fi
          cargo tauri build --ci $sign --runner "$GITHUB_WORKSPACE/scripts/cargo-auditable" \
            --target "${{ matrix.target }}" --config src-tauri/tauri.release.conf.json

      - name: Check the bundled iOS tools against idevice-tools.json (unsigned builds)
        if: env.signed == 'no'
        env:
          SUITEDFIR_BUNDLED_TOOLS_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release/bundle/macos/suiteDFIR.app/Contents/MacOS
          SUITEDFIR_BUNDLED_TOOLS_PLATFORM: ${{ matrix.platform }}
        run: |
          cargo test -p suitedfir-core --test idevice --locked -- --ignored --exact \
            release_bundle_tools_verify_against_the_manifest --nocapture

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/
          ls -l dist
          (cd dist && shasum -a 256 -- *)

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows x64 (NSIS online and offline)
    # Dispatch with os = windows or all; tag pushes only while the repository is public.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'windows' || inputs.os == 'all')) ||
      (github.event_name == 'push' && !github.event.repository.private)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc --version

      - name: Install the Tauri CLI and cargo-auditable (exact versions)
        run: |
          cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked
          cargo install cargo-auditable --version "=${CARGO_AUDITABLE_VERSION}" --locked
          cargo install --list | grep -E '^(tauri-cli|cargo-auditable) '

      - name: Fetch the pinned iOS tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask fetch-idevice-tools --target x86_64-pc-windows-msvc

      # Windows signing is not set up (H1): both installers are unsigned. The online installer
      # downloads WebView2 when it is missing; the offline one embeds its installer.
      - name: Build the online and offline installers (unsigned)
        run: |
          set -euo pipefail
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          runner="$(cygpath -w "$GITHUB_WORKSPACE/scripts/cargo-auditable.cmd")"
          nsis=target/release/bundle/nsis
          mkdir -p dist
          cargo tauri build --ci --no-sign --runner "$runner" --config src-tauri/tauri.release.conf.json
          mv "$nsis/suiteDFIR_${version}_x64-setup.exe" "dist/suiteDFIR_${version}_x64-online-setup.exe"
          cargo tauri build --ci --no-sign --runner "$runner" \
            --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.offline.conf.json
          mv "$nsis/suiteDFIR_${version}_x64-setup.exe" "dist/suiteDFIR_${version}_x64-offline-setup.exe"
          ls -l dist
          (cd dist && sha256sum -- *)

      - name: Check the bundled iOS tools against idevice-tools.json
        env:
          SUITEDFIR_BUNDLED_TOOLS_DIR: ${{ github.workspace }}\target\release
        run: |
          cargo test -p suitedfir-core --test idevice --locked -- --ignored --exact \
            release_bundle_tools_verify_against_the_manifest --nocapture

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-windows-x64
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  # Windows on Arm (S3). Only the online installer: for non-x64 targets Tauri would embed the x86
  # WebView2 offline installer (ARCHITECTURE.md §10). No iOS tools: there is no pinned
  # libimobiledevice build for Windows arm64 (IDEVICE-CLI.md §7), so this leg fetches none and does
  # not use the tauri.release.conf.json overlay, and the app reports acquisition as
  # `unsupported_platform` there.
  windows-arm64:
    name: Windows arm64 (NSIS online)
    # Dispatch with os = windows or all; tag pushes only while the repository is public.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'windows' || inputs.os == 'all')) ||
      (github.event_name == 'push' && !github.event.repository.private)
    runs-on: windows-11-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A native arm64 toolchain even if the image's rustup defaults to an (emulated) x64 host.
      - name: Install Rust (native arm64 toolchain from rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup set default-host aarch64-pc-windows-msvc
          rustup toolchain install
          rustc -vV
          rustc -vV | grep -qx 'host: aarch64-pc-windows-msvc'

      # ring (rustls, used by the app and the Tauri CLI) compiles its aarch64-pc-windows-msvc
      # assembly with clang; the image's LLVM provides it.
      - name: Put clang on PATH
        run: |
          if ! command -v clang >/dev/null; then
            echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
            export PATH="/c/Program Files/LLVM/bin:$PATH"
          fi
          clang --version

      - name: Install the Tauri CLI and cargo-auditable (exact versions)
        run: |
          cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked
          cargo install cargo-auditable --version "=${CARGO_AUDITABLE_VERSION}" --locked
          cargo install --list | grep -E '^(tauri-cli|cargo-auditable) '

      # Windows signing is not set up (H1): the installer is unsigned. It downloads WebView2 when
      # it is missing.
      - name: Build the online installer (unsigned, no iOS tools)
        run: |
          set -euo pipefail
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          runner="$(cygpath -w "$GITHUB_WORKSPACE/scripts/cargo-auditable.cmd")"
          target=aarch64-pc-windows-msvc
          mkdir -p dist
          cargo tauri build --ci --no-sign --runner "$runner" --target "$target"
          if ls "target/$target/release/" | grep -i '^idevice'; then
            echo "::error::iOS tools in the Windows arm64 build output; there is no pinned build for it"
            exit 1
          fi
          mv "target/$target/release/bundle/nsis/suiteDFIR_${version}_arm64-setup.exe" \
            "dist/suiteDFIR_${version}_arm64-online-setup.exe"
          ls -l dist
          (cd dist && sha256sum -- *)

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-windows-arm64
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  # SHA256SUMS and the release notes over everything the build legs and the sources job produced.
  # On a dry run it stops here (read-only token); the draft job below runs for tags only.
  assemble:
    name: Assemble the release files
    needs: [sources, linux, macos, windows, windows-arm64]
    # Legs that did not run are skipped; any failed or cancelled leg stops the release.
    if: >-
      !cancelled() && needs.sources.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build and source files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The macOS wording follows what the macOS legs did: they ran only if MACOS_BUILT, and their
      # build step signs and notarizes by exactly these secret rules (a failed signing or
      # notarization fails the leg, and this job then does not run). Bundles that this workflow did
      # not build are local, unsigned builds (H1).
      - name: SHA256SUMS and release notes
        env:
          MACOS_SIGNING_SECRETS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_TEAM_ID != '' }}
          MACOS_NOTARIZATION_SECRETS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' }}
          MACOS_BUILT: ${{ needs.macos.result == 'success' }}
          WINDOWS_BUILT: ${{ needs.windows.result == 'success' }}
          WINDOWS_ARM64_BUILT: ${{ needs.windows-arm64.result == 'success' }}
          LINUX_BUILT: ${{ needs.linux.result == 'success' }}
        run: |
          set -euo pipefail
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          tools="$(jq -r .version idevice-tools.json)"
          (cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS)
          cat dist/SHA256SUMS
          unsigned="The macOS builds are **unsigned** (not signed with a Developer ID and not notarized): macOS blocks them until you allow them, see the user guide."
          if [ "$MACOS_BUILT" != true ] || [ "$MACOS_SIGNING_SECRETS" != true ]; then
            macos_signing="$unsigned"
          elif [ "$MACOS_NOTARIZATION_SECRETS" = true ]; then
            macos_signing="The macOS builds are signed with a Developer ID and notarized."
          else
            macos_signing="The macOS builds are signed with a Developer ID but **not notarized**: macOS blocks them until you allow them, see the user guide."
          fi
          missing=""
          [ "$MACOS_BUILT" = true ] || missing="$missing macOS (arm64 and x64 dmg)"
          [ "$WINDOWS_BUILT" = true ] || missing="$missing${missing:+,} Windows x64 (online and offline installers)"
          [ "$WINDOWS_ARM64_BUILT" = true ] || missing="$missing${missing:+,} Windows arm64 (online installer)"
          {
            echo "suiteDFIR $version (draft created by release.yml; review before publishing)."
            echo
            echo "**Code signing.** $macos_signing The Windows installers are **unsigned**: SmartScreen warns before running them. The Linux packages are not signed."
            if [ -n "$missing" ]; then
              echo
              echo "**Not built by this workflow:**$missing. Those bundles are built locally or by a dispatch of this workflow (DEVELOPMENT.md §2, §6) and added to this draft by hand, with SHA256SUMS updated."
            fi
            if [ "$WINDOWS_ARM64_BUILT" = true ]; then
              echo
              echo "**Windows on Arm.** Windows arm64 has only the online installer (it downloads WebView2 when it is missing), and iOS acquisition is not available there: there is no pinned build of the iOS tools for it."
            fi
            if [ "$LINUX_BUILT" = true ]; then
              echo
              echo "**Linux arm64.** The Linux arm64 AppImage and deb, like the x64 ones, use the distribution's iOS tools."
            fi
            echo
            echo "**Files.**"
            echo
            echo "| File | Size (bytes) |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(stat -c %s "$f") |"
            done
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`)."
            echo
            echo "**Installation, prerequisites and privacy:** docs/USER-GUIDE.md. The Linux parser builds need glibc 2.43 or later."
            echo
            echo "**Source code for the bundled iOS tools.** The macOS and Windows x64 builds include libimobiledevice $tools tools (LGPL-2.1-or-later; the Windows arm64 and Linux builds include none), built from the source tarballs attached here by the attached \`build-idevice-tools.sh\` (the version that built the pinned tool bundles; its SHA-256 is in each \`BUILDINFO-<platform>.json\`), which applies the attached \`*.patch\` files (two small changes to Mbed TLS and libimobiledevice, marked \"Modified for suiteDFIR\"; their SHA-256s are in each \`BUILDINFO-<platform>.json\` too). THIRD-PARTY-NOTICES.md lists every license."
          } > "$RUNNER_TEMP/RELEASE-NOTES.md"
          # Only now, so the file table above does not list the notes themselves.
          mv "$RUNNER_TEMP/RELEASE-NOTES.md" dist/RELEASE-NOTES.md
          cat dist/RELEASE-NOTES.md

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  draft:
    name: Draft release (never published by automation, H3)
    needs: [assemble]
    # Explicit status check: without it the implicit success() would also require the skipped
    # macOS/Windows legs (assemble's own needs) and skip the draft on a private repository.
    if: >-
      ${{ !cancelled() && needs.assemble.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE-NOTES.md"
          mv dist/RELEASE-NOTES.md "$notes"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "suiteDFIR ${GITHUB_REF_NAME#v}" --notes-file "$notes" dist/*
