# UI type checking and tests (DEVELOPMENT.md §6). Runs on non-draft pull requests and pushes to main
# that touch the UI or its tooling.
name: ci-js

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ui/**"
      - "ui-dev/**"
      - "tests/ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/ci-js.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "ui-dev/**"
      - "tests/ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/ci-js.yml"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  js:
    name: JS (typecheck, tests)
    # Draft pull requests are skipped.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm test
        run: npm test
