# Rust CI (DEVELOPMENT.md §6). On pull requests (not drafts) and pushes to main, the Linux,
# macOS and Windows jobs all run; on a private repository only the Linux job would. A dispatch
# runs the jobs its `os` input selects.
name: ci-rust

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "crates/**"
      - "src-tauri/**"
      - "xtask/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - "leapp-manifest.json"
      - "idevice-tools.json"
      - "fixtures/**"
      - "ui-dev/fixtures/contracts/**"
      - "docs/CONTRACTS.md"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/ci-rust.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "crates/**"
      - "src-tauri/**"
      - "xtask/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - "leapp-manifest.json"
      - "idevice-tools.json"
      - "fixtures/**"
      - "ui-dev/fixtures/contracts/**"
      - "docs/CONTRACTS.md"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/ci-rust.yml"
  workflow_dispatch:
    inputs:
      os:
        description: "Which OS job(s) to run"
        type: choice
        options: [linux, macos, windows, all]
        default: linux

permissions:
  contents: read

# Pull request runs share one group per PR, and a newer run cancels the superseded one. Every other
# run (push to main, dispatch) gets its own group, so it is never cancelled, not even while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Rust (Linux)
    # Draft pull requests are skipped. On dispatch, runs for os = linux or all.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'linux' || inputs.os == 'all')) ||
      (github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    # glibc baseline for Linux builds (ARCHITECTURE.md §10).
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      # The toolchain and the cargo registry belong to the unprivileged `builder` user (see below).
      CARGO_HOME: /home/builder/.cargo
      RUSTUP_HOME: /home/builder/.rustup
    defaults:
      run:
        # Steps run as the unprivileged `builder` user, never as root: root bypasses file permissions,
        # so permission and read-only tests would behave differently than on real machines. Only the
        # setup steps that need root say `shell: bash`.
        shell: setpriv --reuid=builder --regid=builder --init-groups env HOME=/home/builder USER=builder LOGNAME=builder bash --noprofile --norc -eo pipefail {0}
    steps:
      # git must exist before checkout, otherwise actions/checkout falls back to a REST download without .git.
      - name: Install system packages (DEVELOPMENT.md §1, plus git and CA certificates)
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential libssl-dev pkg-config curl wget file

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same uid as the owner of the mounted workspace, so the user can read the runner's step scripts
      # and write the runner's file commands.
      - name: Create the unprivileged build user
        shell: bash
        run: |
          uid="$(stat -c %u "$GITHUB_WORKSPACE")"
          if [ "$uid" -eq 0 ]; then
            echo "::error::$GITHUB_WORKSPACE is owned by root; cannot choose an unprivileged uid"
            exit 1
          fi
          useradd --create-home --uid "$uid" --user-group --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          id builder

      - name: Check that the build steps run unprivileged
        run: |
          echo "build steps run as: $(id)"
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::build steps must not run as root"
            exit 1
          fi
          probe="$(mktemp)"
          chmod 000 "$probe"
          if cat "$probe" 2>/dev/null; then
            echo "::error::a mode-000 file was readable; file permissions are not enforced"
            exit 1
          fi
          rm -f "$probe"

      - name: Install Rust (pinned rustup-init; toolchain from rust-toolchain.toml)
        env:
          # https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          # (SHA-256 computed from the download and equal to the published rustup-init.sha256).
          # Step-level env: rust-cache hashes job-level CARGO*/RUST* variables into its cache key.
          RUSTUP_INIT_VERSION: "1.29.1"
          RUSTUP_INIT_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
        run: |
          dl="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dl/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  $dl/rustup-init" | sha256sum -c -
          chmod +x "$dl/rustup-init"
          "$dl/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          # No arguments: installs the toolchain and components pinned in rust-toolchain.toml.
          rustup toolchain install
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          # Only runs on main save the cache; pull request runs restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache runs as root: hand whatever it restored or created back to the build user.
      - name: Give the cache to the build user
        shell: bash
        run: chown -R builder:builder "$CARGO_HOME" "$RUSTUP_HOME" "$GITHUB_WORKSPACE"

      - name: Install cargo-deny (prebuilt, SHA-256 pinned)
        shell: bash
        env:
          # Release asset cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz (SHA-256 computed from the
          # download; equal to the release's published .sha256 file and asset digest).
          DENY_VERSION: "0.20.2"
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          asset="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$asset.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/$asset.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset.tar.gz" -C "$RUNNER_TEMP" "$asset/cargo-deny"
          install -m 0755 "$RUNNER_TEMP/$asset/cargo-deny" /usr/local/bin/cargo-deny

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo deny check
        run: |
          cargo deny --version
          cargo deny --locked check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Before the tests, so a contract change without regenerated fixtures fails here. Like every
      # cargo step it uses the job's default (unprivileged builder) shell.
      - name: contracts-drift
        run: |
          cargo --locked xtask contracts
          if ! git diff --exit-code -- ui-dev/fixtures/contracts; then
            echo "::error::ui-dev/fixtures/contracts is stale: run 'cargo xtask contracts' and commit the result"
            exit 1
          fi
          changes="$(git status --porcelain --untracked-files=all -- ui-dev/fixtures/contracts)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::'cargo xtask contracts' added files to ui-dev/fixtures/contracts; commit the result"
            exit 1
          fi

      # THIRD-PARTY-NOTICES.md must be what `cargo xtask notices` generates (ROADMAP F2). It downloads
      # the pinned tool bundles (public release assets, through the API with the job's read-only
      # token) and a few pinned license files. Unprivileged like every cargo step.
      - name: notices-drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo --locked xtask notices
          if ! git diff --exit-code -- THIRD-PARTY-NOTICES.md; then
            echo "::error::THIRD-PARTY-NOTICES.md is stale: run 'cargo xtask notices' and commit the result"
            exit 1
          fi

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build
        run: cargo build --workspace --locked

  macos:
    name: Rust (macOS)
    # Dispatch with os = macos or all; otherwise only on a public repository (drafts skipped).
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'macos' || inputs.os == 'all')) ||
      (github.event_name != 'workflow_dispatch' && !github.event.repository.private &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc --version

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build
        run: cargo build --workspace --locked

  windows:
    name: Rust (Windows)
    # Dispatch with os = windows or all; otherwise only on a public repository (drafts skipped).
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'windows' || inputs.os == 'all')) ||
      (github.event_name != 'workflow_dispatch' && !github.event.repository.private &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc --version

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build
        run: cargo build --workspace --locked
