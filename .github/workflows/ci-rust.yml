# Rust CI (DEVELOPMENT.md §6). While the repository is private only the Linux job runs on
# pull requests and pushes to main; the macOS and Windows jobs run only when dispatched with a
# matching `os` input, or automatically once the repository is public.
name: ci-rust

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src-tauri/**"
      - "xtask/**"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".cargo/**"
      - "leapp-manifest.json"
      - "idevice-tools.json"
      - "fixtures/**"
      - "ui-dev/fixtures/contracts/**"
      - ".github/workflows/ci-rust.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src-tauri/**"
      - "xtask/**"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".cargo/**"
      - "leapp-manifest.json"
      - "idevice-tools.json"
      - "fixtures/**"
      - "ui-dev/fixtures/contracts/**"
      - ".github/workflows/ci-rust.yml"
  workflow_dispatch:
    inputs:
      os:
        description: "Which OS job(s) to run"
        type: choice
        options: [linux, macos, windows, all]
        default: linux

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main always finish because they seed the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Rust (Linux)
    # Draft pull requests are skipped. On dispatch, runs for os = linux or all.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'linux' || inputs.os == 'all')) ||
      (github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    # glibc baseline for Linux builds (ARCHITECTURE.md §10).
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      # rustup-init: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
      # (SHA-256 computed from the download and equal to the published rustup-init.sha256).
      RUSTUP_INIT_VERSION: "1.29.1"
      RUSTUP_INIT_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
      # cargo-deny prebuilt release asset cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
      # (SHA-256 computed from the download; equal to the release's published .sha256 file and asset digest).
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      # git must exist before checkout, otherwise actions/checkout falls back to a REST download without .git.
      - name: Install system packages (DEVELOPMENT.md §1, plus git and CA certificates)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential libssl-dev pkg-config curl wget file

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (pinned rustup-init; toolchain from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # No arguments: installs the toolchain and components pinned in rust-toolchain.toml.
          rustup toolchain install
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          # Only runs on main save the cache; pull request runs restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny (prebuilt, SHA-256 pinned)
        run: |
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$asset.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$asset.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset.tar.gz" -C "$RUNNER_TEMP" "$asset/cargo-deny"
          mkdir -p "$RUNNER_TEMP/cargo-deny-bin"
          install -m 0755 "$RUNNER_TEMP/$asset/cargo-deny" "$RUNNER_TEMP/cargo-deny-bin/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny-bin" >> "$GITHUB_PATH"

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo deny check
        run: |
          cargo deny --version
          cargo deny --locked check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build
        run: cargo build --workspace --locked

      - name: contracts-drift (no-op until M0.3)
        run: echo "contracts-drift is a no-op until ROADMAP M0.3 adds 'cargo xtask contracts'."

  macos:
    name: Rust (macOS)
    # Dispatch with os = macos or all; otherwise only once the repository is public (drafts skipped).
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'macos' || inputs.os == 'all')) ||
      (github.event_name != 'workflow_dispatch' && !github.event.repository.private &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc --version

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build
        run: cargo build --workspace --locked

  windows:
    name: Rust (Windows)
    # Dispatch with os = windows or all; otherwise only once the repository is public (drafts skipped).
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'windows' || inputs.os == 'all')) ||
      (github.event_name != 'workflow_dispatch' && !github.event.repository.private &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc --version

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build
        run: cargo build --workspace --locked
