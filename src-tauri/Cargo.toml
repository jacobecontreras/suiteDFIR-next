[package]
name = "suitedfir"
description = "suiteDFIR desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "~2.6", default-features = false, features = ["config-json"] }

[dependencies]
tauri = { version = "~2.11", default-features = false, features = ["wry", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-dialog = "2"
