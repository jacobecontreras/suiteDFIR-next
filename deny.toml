# cargo-deny configuration (DEVELOPMENT.md §4.2). Checks every target platform.

[advisories]
# Transitive unmaintained crates in the Tauri/GTK stack are known and accepted.
# Vulnerabilities are always errors (cargo-deny has no setting to relax them; never add `ignore` entries for them).
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[sources]
# crates.io only: no other registries, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
