[package]
name = "xtask"
description = "suiteDFIR repository maintenance tasks, run as `cargo xtask <command>`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
suitedfir-core = { path = "../crates/core" }
# fetch-idevice-tools (ROADMAP X1), with the DEVELOPMENT.md §4.2 specs.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
